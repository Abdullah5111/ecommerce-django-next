name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django on Postgres, ${{ matrix.cache }})
    runs-on: ubuntu-24.04

    # The suite runs twice: on the in-memory fallbacks (LocMem cache,
    # InMemory channel layer) and on real Redis, so the cache, rate limits,
    # phone codes and WebSocket fan-out are exercised on what production runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache: in-memory
            redis_url: ""
          - cache: redis
            redis_url: redis://localhost:6379/0

    # Postgres rather than SQLite: the product search branches on
    # connection.vendor, so only this path exercises the full-text code that
    # production actually runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      PAYMENTS_MOCK: "true"
      DB_ENGINE: postgres
      DB_NAME: ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: ${{ matrix.redis_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Django 5.0 does not support 3.13+.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        if: matrix.cache == 'in-memory'  # same code either way; lint once
        working-directory: backend
        run: pip install ruff==0.7.4 && ruff check .

      - name: Check models and migrations agree
        if: matrix.cache == 'in-memory'
        working-directory: backend
        # Fails if a model change has no migration — the guard for
        # hand-written migration files.
        run: python manage.py makemigrations --check --dry-run

      - name: Confirm the Redis backends are active
        if: matrix.cache == 'redis'
        working-directory: backend
        # Guards against config silently falling back to LocMem/InMemory.
        run: >-
          python manage.py shell -c "from django.conf import settings as s;
          from django.core.cache import cache;
          assert s.CACHES['default']['BACKEND'].endswith('RedisCache'), s.CACHES;
          assert s.CHANNEL_LAYERS['default']['BACKEND'].endswith('RedisChannelLayer');
          cache.set('ci-probe', 1); assert cache.get('ci-probe') == 1;
          print('Redis cache and channel layer active')"

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=2

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint (eslint)
        working-directory: frontend
        run: npx next lint --max-warnings 0

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx next build
