# Weekly dependency update PRs (never direct pushes to main). Minor/patch
# bumps are grouped into one PR per ecosystem so CI runs once for them; major
# versions arrive as their own PRs because they're the ones that break things.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Stay on the Django 5.2 LTS line (security support to April 2028): 6.x
    # releases aren't LTS. 5.2.x security/patch releases still come through.
    ignore:
      - dependency-name: django
        versions: [">=6.0"]
    commit-message:
      prefix: deps(backend)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(frontend)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
