# Shared by every service that runs Django code (web, Celery worker and beat).
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://ecommerce:ecommerce@rabbitmq:5672//
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      # The default guest account only accepts localhost connections.
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce
    ports:
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py shell < seed.py &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  worker:
    <<: *backend
    command: celery -A core worker -l info

  beat:
    <<: *backend
    # Scheduler only: enqueues periodic tasks (see CELERY_BEAT_SCHEDULE) for the worker.
    command: celery -A core beat -l info -s /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      args:
        # Client (browser) calls the published backend port; baked into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    environment:
      # Server-side rendering runs inside the container — reach the backend service
      # directly, not the frontend's own localhost.
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
