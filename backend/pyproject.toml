[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pyflakes, import order, bugbear, pyupgrade, and the pycodestyle errors that
# catch real mistakes (formatting is left to the editor).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Django must be initialised before the routing/middleware imports.
"core/asgi.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "cart", "chat", "core", "coupons", "notifications",
    "orders", "payments", "products", "returns", "wishlist",
]
